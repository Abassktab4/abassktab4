<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام مركز صيانة البدير</title></head><body><div id="app"></div><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyCxEoFMCx8PI1rGlfwGL_oRzbbrDsqHnvg',authDomain:'badir-system.firebaseapp.com',projectId:'badir-system',storageBucket:'badir-system.firebasestorage.app',messagingSenderId:'964558802838',appId:'1:964558802838:web:ec4f88f1502f8b097397b7'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),provider=new GoogleAuthProvider();
const root=document.getElementById('app');
root.innerHTML='<div style="font-family:Arial;max-width:700px;margin:60px auto;text-align:center"><h1>نظام مركز صيانة البدير</h1><button id="login" style="font-size:18px;padding:14px 25px;cursor:pointer">🔐 تسجيل الدخول بحساب Google</button><p id="status"></p></div>';
const status=document.getElementById('status');
document.getElementById('login').onclick=async()=>{try{status.textContent='جاري فتح حساب Google...';const r=await signInWithPopup(auth,provider);status.textContent='تم تسجيل الدخول: '+(r.user.email||'');}catch(e){console.error(e);status.textContent='⚠️ '+e.code+' — '+e.message;}};
onAuthStateChanged(auth,user=>{if(user){status.textContent='✅ تم تسجيل الدخول: '+(user.email||'');document.getElementById('login').style.display='none';}});
</script></body></html>
